language = "C"
include_guard = "EINDIR_CORE_H"
include_version = false
pragma_once = true
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. */"
after_includes = "#include <dlpack/dlpack.h>"
no_includes = false
cpp_compat = true
line_length = 80
tab_width = 4
braces = "SameLine"
documentation = true
documentation_style = "Doxy"
documentation_length = "full"
line_endings = "LF"

# DLPack 1.0 declares DLManagedTensorVersioned as a struct tag without a
# typedef, so C consumers must spell out the tag.
[export.rename]
"DLManagedTensorVersioned" = "struct DLManagedTensorVersioned"

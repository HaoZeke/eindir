name: Skills

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  skills:
    name: Skills and llms.txt
    runs-on: ubuntu-latest
    env:
      COGAPP_VERSION: "3.6.0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: llms.txt and llms-full.txt match the manual
        run: python scripts/llms/build_llms.py --check

      - name: Generator tests
        run: python -m unittest discover -s scripts/llms -p "test_*.py" -v

      - name: Skill frontmatter, script references and links
        run: python scripts/skills/run_skills.py --no-run

      # rustfmt and clippy check the Rust skill's examples.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Setup sccache environment
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config valgrind libc6-dbg

      # The C ABI skill fetches the DLPack headers itself and checks them
      # against DLPACK_SHA256 in ci.yml.
      - name: Install cargo-c
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-c

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      # cogapp lets the contributing skill run the version drift check.
      - name: Install maturin, NumPy and cogapp
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.5,<2" numpy "cogapp==${COGAPP_VERSION}"

      - name: maturin develop
        run: maturin develop --features python

      - name: Run every skill's examples and scripts
        run: python scripts/skills/run_skills.py

# Input for scripts/llms/build_llms.py. It writes llms.txt and
# llms-full.txt at the repository root from the Org sources under
# docs/orgmode/, in the order of the toctrees in docs/orgmode/index.org,
# then AGENTS.md and the skills. Links go to the sources on GitHub.
#
#   python3 scripts/llms/build_llms.py           # rewrite both files
#   python3 scripts/llms/build_llms.py --check   # exit 1 if either is stale

[project]
branch = "main"
full_note = "The pages follow in the order of the site's navigation, converted from Org to Markdown. The Rust API reference that Sphinx generates from the doc comments in `src/` is not included, so read the sources or run `cargo doc --open`."
links = "raw"
name = "eindir"
notes = [
  "Each link points at the Org source of a page under `docs/orgmode/` on GitHub. The site, https://eindir.rgoswami.me/, is built from the same sources by Sphinx, and `llms-full.txt` has every page as Markdown in one file.",
  "The Python package is narrower than the Rust crate. `eindir` exports `NumLimit`, `FPair`, `ObjectiveFunction`, `OutOfBounds`, `low_discrepancy_points`, `styblinski_tang` and array API, DLPack and TVM-FFI helpers, and `eindir._core` adds `Bounds`, `PyObjective` and `shifted_low_discrepancy_points`. `GleThermostat`, `optimal_sampling_drift`, `matrix_exp`, `ldl_sqrt`, `halton_unit`, the surrogates, the gradient adapters and the builtin objective types are Rust-only. CI runs the Python blocks of the manual, and the Rust code in the tutorials is included from `examples/`.",
  "The `eindir-python` skill and the three others under `skills/` give worked examples of common tasks, with scripts that CI runs. `AGENTS.md` has the build, test and documentation commands and the mistakes that are easy to make. Both are reproduced at the end of `llms-full.txt`.",
]
repo = "https://github.com/HaoZeke/eindir"
summary = """
eindir is a Rust crate, eindir-core, with Python, C and C++ bindings.
It has the primitives for bounded optimisation and sampling on R^D:
the Objective trait, box bounds, Halton point sets, gradients, a GLE
coloured-noise thermostat and surrogate models. The anneal optimiser is
built on it.
"""

[output]
full = "llms-full.txt"
index = "llms.txt"

[docs]
index = "index.org"
optional = ["changelog", "code_of_conduct"]
# changelog.org only includes CHANGELOG.md, which is read directly.
org_exclude = ["changelog"]
root = "docs/orgmode"
section_order = [
  "Tutorials",
  "How-to Guides",
  "Explanation",
  "Reference",
  "Development",
  "Skills",
]

[docs.sources]
changelog = "CHANGELOG.md"

[titles]
index = "Overview"

[descriptions]
architecture = "The repository layout, the three crate types (rlib, cdylib, staticlib), how the Python, C and C++ bindings are produced, and where the version lives."
bindings = "How the Python wheel, the C library with its header and pkg-config file, and the C++ header are built, with Meson and CMake snippets for consumers."
changelog = "Release notes, newest first."
code_of_conduct = "The Contributor Covenant 2.1, as adopted by the project."
contributing = "Setup, commit types, towncrier fragments, the single version source in Cargo.toml, style, tests and the documentation checks."
"dev/best_practices" = "Define the objective once, use low-discrepancy starts, reuse the GLE drift, accept surrogate proposals with the true objective, and keep arrays on their device."
"explanation/c-abi" = "The two C handles, the ABI stamp and its compatibility rule, the semantic descriptor and its wildcards, the DLPack tensor rules, error reporting and the Rust wrappers."
"explanation/fallible-objectives" = "The TryObjective, TryGradient and TryDifferentiableObjective traits with a caller-chosen error type, their blanket impls for infallible objectives, the adapters, the C status-and-message callbacks, and how a driver should carry the error."
"explanation/gle" = "What the GLE thermostat computes, why the covariance fixes correctness while the drift sets the speed, the fitted optimal-sampling drift, with references."
"explanation/low-discrepancy" = "Why Halton points, how the radical inverse builds them, Cranley-Patterson shifts and corner-anchored designs, with references."
"explanation/primitives" = "The objective and bounds traits and how the point sets, gradients, GLE thermostat, surrogates and bindings relate to them."
"explanation/surrogates" = "The additive Chebyshev surrogate and its backfitting, independence proposals corrected by the true objective, and reduced objectives on an active subspace, with references."
"howto/c-objective" = "Install the C library, check the ABI stamp, write value and gradient callbacks, create or embed a handle, report failures with a message, and wrap the handle in Rust, with a complete C program."
"howto/fallible" = "Write an objective that returns errors, pass them through a generic driver unchanged, and turn them into NaN for infallible code, with a complete Rust program."
"howto/faq" = "ImportError from old examples, gradients, use without anneal, TypeError and PanicException from Python, C and C++ use, the licence (MIT) and how to cite eindir."
"howto/gradients" = "Give an objective a gradient in Rust (by hand, closure, forward-mode AD or central differences), in Python with grad_fn, and in C."
"howto/install" = "Install from PyPI or crates.io, build the Python package or the C library from source, and use the pixi environments."
"howto/using-with-anneal" = "Which eindir items the anneal drivers use for the objective, start points, GLE moves and surrogate proposals."
index = "What eindir provides, its bindings, the pages to read first, and how to cite it."
quickstart = "Evaluate a function at eight Halton points in a box, from Python and from Rust, with the output of each."
"reference/api-primitives" = "Every name in eindir and eindir._core with its signature, the argument types and exceptions, and the list of Rust-only items."
"reference/c-api" = "Every function, type and constant of eindir-core.h: version and compatibility, errors, both handles, the descriptor, tensor rules and the Rust wrappers."
"reference/glossary" = "Short definitions of the terms the manual uses, from ABI stamp to TryObjective."
"reference/rust-api" = "The entry page of the Rust API reference that Sphinx generates from the doc comments of the crate."
tutorials = "The tutorials, what each covers, and how to print the installed version."
"tutorials/gle-thermostat" = "Build the GLE thermostat with the optimal-sampling drift, start it at equilibrium and check the momentum variance, in Rust."
"tutorials/low-discrepancy" = "Halton points from Python and Rust: plain designs, skip, seeded shifted replicas and corner-anchored designs."
"tutorials/quickstart" = "Wrap a Python function and its gradient as an objective, draw start points, and use the pure-Python NumLimit and ObjectiveFunction."
"tutorials/surrogates" = "Fit an additive surrogate on a Halton pilot, draw proposals from it, and search along one direction with a reduced objective, in Rust."

[[links]]
description = "Build, test and documentation commands, common tasks and pitfalls for working in this repository."
full = true
path = "AGENTS.md"
section = "Development"
title = "AGENTS.md"

[[links]]
description = "The whole manual, AGENTS.md and the skills as one Markdown file."
path = "llms-full.txt"
section = "Optional"
title = "llms-full.txt"

[skills]
dir = "skills"
full = true

[tool.towncrier]
name = "eindir"
# Generated from Cargo.toml; run tools/sync-version.sh after a bump.
# [[[cog import cargo_version; cog.outl(f'version = "{cargo_version.VERSION}"') ]]]
version = "0.7.0"
# [[[end]]]
directory = "docs/newsfragments"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/HaoZeke/eindir/tree/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/HaoZeke/eindir/issues/{issue})"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "dev"
name = "Developer"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory   = "misc"
name        = "Miscellaneous"
showcontent = true
